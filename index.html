<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Developer Associate · Practice Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10151c;
    --panel: #171f29;
    --panel-raised: #1e2734;
    --border: #2a3543;
    --text: #e7ecf2;
    --text-muted: #8b98a9;
    --accent: #ff9900;
    --accent-dim: #b56f0f;
    --accent-text: #1a1305;
    --ok: #3fb97f;
    --danger: #e2604f;
    --font-sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --radius: 6px;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f3f1eb;
      --panel: #ffffff;
      --panel-raised: #fbfaf7;
      --border: #ddd7c9;
      --text: #201c14;
      --text-muted: #6b6558;
      --accent: #c76f00;
      --accent-dim: #a85c00;
      --accent-text: #fff8ee;
    }
  }
  :root[data-theme="light"] {
    --bg: #f3f1eb;
    --panel: #ffffff;
    --panel-raised: #fbfaf7;
    --border: #ddd7c9;
    --text: #201c14;
    --text-muted: #6b6558;
    --accent: #c76f00;
    --accent-dim: #a85c00;
    --accent-text: #fff8ee;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }
  body { min-height: 100vh; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
    flex-wrap: wrap;
    gap: 10px;
  }
  .topbar .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand .mark {
    font-family: var(--font-mono);
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.02em;
  }
  .brand .title { font-weight: 600; font-size: 1rem; }
  .brand .subtitle { color: var(--text-muted); font-size: 0.85rem; }
  .progress-pill {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    color: var(--text-muted);
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 5px 12px;
  }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 80px;
    display: grid;
    grid-template-columns: 200px 1fr;
    gap: 24px;
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .navgrid { order: 2; }
  }

  .navgrid {
    align-self: start;
    position: sticky;
    top: 76px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .navgrid h2 {
    margin: 0 0 10px;
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .navgrid .grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
  }
  @media (max-width: 760px) {
    .navgrid .grid { grid-template-columns: repeat(10, 1fr); }
  }
  .navgrid button {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    border: 1px solid var(--border);
    background: var(--panel-raised);
    color: var(--text-muted);
    border-radius: 4px;
    padding: 6px 0;
    cursor: pointer;
  }
  .navgrid button.current { border-color: var(--accent); color: var(--accent); }
  .navgrid button.answered { color: var(--text); border-color: var(--ok); }
  .navgrid button.answered.current { border-color: var(--accent); }
  .navgrid .legend { margin-top: 12px; font-size: 0.72rem; color: var(--text-muted); line-height: 1.6; }
  .navgrid .legend span { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
  .dot-answered { background: var(--ok); }
  .dot-unanswered { background: var(--border); }

  .review-link {
    width: 100%;
    margin-top: 14px;
    background: transparent;
    border: 1px dashed var(--border);
    color: var(--text-muted);
    font-family: var(--font-sans);
    font-size: 0.8rem;
    border-radius: 4px;
    padding: 8px;
    cursor: pointer;
  }
  .review-link:hover { border-color: var(--accent); color: var(--accent); }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
  }
  .q-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .q-number {
    font-family: var(--font-mono);
    color: var(--accent);
    font-size: 0.85rem;
  }
  .q-type-badge {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
  }
  .q-text {
    font-size: 1.05rem;
    line-height: 1.55;
    margin: 0 0 22px;
    max-width: 68ch;
  }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--panel-raised);
    cursor: pointer;
    transition: border-color 0.12s ease;
  }
  .option:hover { border-color: var(--accent-dim); }
  .option.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--panel-raised)); }
  .option input { margin-top: 3px; accent-color: var(--accent); flex-shrink: 0; }
  .option label { cursor: pointer; line-height: 1.45; font-size: 0.94rem; }

  .nav-buttons {
    display: flex;
    justify-content: space-between;
    margin-top: 26px;
    gap: 10px;
  }
  .btn {
    font-family: var(--font-sans);
    font-size: 0.9rem;
    font-weight: 500;
    padding: 10px 18px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--panel-raised);
    color: var(--text);
    cursor: pointer;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }
  .btn-primary:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
  .btn-ghost { background: transparent; }

  /* Review / results */
  .review-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 18px;
  }
  .review-header h1 { font-size: 1.2rem; margin: 0; }
  .review-header .count { font-family: var(--font-mono); color: var(--text-muted); font-size: 0.85rem; }

  .review-item {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 12px;
    background: var(--panel);
  }
  .review-item .head {
    display: flex;
    gap: 10px;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .review-item .head .num { font-family: var(--font-mono); color: var(--accent); font-size: 0.82rem; }
  .review-item .head .flag {
    font-size: 0.7rem;
    color: var(--danger);
    font-family: var(--font-mono);
  }
  .review-item .qtext { font-size: 0.95rem; line-height: 1.5; margin: 0 0 10px; max-width: 70ch; }
  .review-item .selected-list { display: flex; flex-direction: column; gap: 6px; }
  .review-item .sel-option {
    font-size: 0.88rem;
    padding: 8px 12px;
    border-radius: 4px;
    background: var(--panel-raised);
    border: 1px solid var(--border);
  }
  .review-item .sel-option.picked { border-color: var(--ok); }
  .review-item .sel-option .tag {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ok);
    margin-right: 8px;
  }
  .review-item .none { color: var(--text-muted); font-size: 0.85rem; font-style: italic; }

  /* Results: correct/incorrect answer states */
  .review-item.graded-correct { border-color: var(--ok); }
  .review-item.graded-incorrect { border-color: var(--danger); }
  .review-item .grade-tag {
    font-family: var(--font-mono);
    font-size: 0.68rem;
    border-radius: 999px;
    padding: 2px 10px;
    margin-left: auto;
  }
  .grade-tag.tag-correct { color: var(--ok); border: 1px solid var(--ok); }
  .grade-tag.tag-incorrect { color: var(--danger); border: 1px solid var(--danger); }
  .sel-option.opt-correct-picked { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--panel-raised)); }
  .sel-option.opt-wrong-picked { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, var(--panel-raised)); }
  .sel-option.opt-missed-correct { border-color: var(--ok); border-style: dashed; }
  .sel-option .tag.tag-wrong { color: var(--danger); }
  .sel-option .tag.tag-missed { color: var(--ok); }
  .review-item .edit-link {
    margin-top: 10px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.78rem;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .review-item .edit-link:hover { color: var(--accent); }

  .submit-bar {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 22px;
  }

  .results-banner {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .results-banner .stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .results-banner .stat { font-family: var(--font-mono); font-size: 1.4rem; color: var(--accent); }
  .results-banner .stat.stat-score { color: var(--ok); }
  .results-banner .stat-label { font-size: 0.78rem; color: var(--text-muted); }

  .hidden { display: none !important; }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.75rem;
    padding: 20px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="mark">&#9635;</span>
    <span class="title">AWS Certified Developer &ndash; Associate</span>
    <span class="subtitle">DVA-C02 practice set</span>
  </div>
  <div class="progress-pill" id="progressPill">0 / 30 answered</div>
</div>

<div class="app" id="testView">
  <nav class="navgrid">
    <h2>Questions</h2>
    <div class="grid" id="navGrid"></div>
    <div class="legend">
      <div><span class="dot-answered"></span>Answered</div>
      <div><span class="dot-unanswered"></span>Not answered</div>
    </div>
    <button class="review-link" id="reviewBtn">Review &amp; submit</button>
  </nav>

  <div class="card" id="questionCard"></div>
</div>

<div class="app hidden" id="reviewView">
  <div style="grid-column: 1 / -1;">
    <div class="review-header">
      <h1>Review your answers</h1>
      <span class="count" id="reviewCount"></span>
    </div>
    <div id="reviewList"></div>
    <div class="submit-bar">
      <button class="btn btn-ghost" id="backToTest">Back to test</button>
      <button class="btn btn-primary" id="submitBtn">Submit test</button>
    </div>
  </div>
</div>

<div class="app hidden" id="resultsView">
  <div style="grid-column: 1 / -1;">
    <div class="results-banner">
      <div class="stats">
        <div>
          <div class="stat stat-score" id="resultsScore">0/30</div>
          <div class="stat-label">answered correctly</div>
        </div>
        <div>
          <div class="stat" id="resultsAnswered">0/30</div>
          <div class="stat-label">questions answered</div>
        </div>
      </div>
      <button class="btn" id="retakeBtn">Start a new attempt</button>
    </div>
    <div id="resultsList"></div>
  </div>
</div>

<footer>Practice questions only &middot; not an official AWS product</footer>

<script>
(function () {
  var QUESTIONS = [{"id": 1, "type": "single", "text": "A developer is deploying a new application to Amazon Elastic Container Service (Amazon ECS). The developer needs to securely store and retrieve different types of variables. These variables include authentication information for a remote API, the URL for the API, and credentials. The authentication information and API URL must be available to all current and future deployed versions of the application across development, testing, and production environments. How should the developer retrieve the variables with the FEWEST application changes?", "options": ["Update the application to retrieve the variables from AWS Systems Manager Parameter Store. Use unique paths in Parameter Store for each variable in each environment. Store the credentials in AWS Secrets Manager in each environment", "Update the application to retrieve the variables from AWS Key Management Service (AWS KMS). Store the API URL and credentials as unique keys for each environment.", "Update the application to retrieve the variables from an encrypted file that is stored with the application. Store the API URL and credentials in unique files for each environment.", "Update the application to retrieve the variables from each of the deployed environments. Define the authentication information and API URL in the ECS task definition as unique names during the deployment process."], "correct": [0]}, {"id": 2, "type": "single", "text": "A developer is creating an application. New users of the application must be able to create an account and register by using their own social media accounts. Which AWS service or resource should the developer use to meet these requirements?", "options": ["IAM role", "Amazon Cognito identity pools", "Amazon Cognito user pools", "AWS Directory Service"], "correct": [2]}, {"id": 3, "type": "single", "text": "A company stores its data in data tables in a series of Amazon S3 buckets. The company received an alert that customer credit card information might have been exposed in a data table on one of the company's public applications. A developer needs to identify all potential exposures within the application environment. Which solution will meet these requirements?", "options": ["Use Amazon Athena to run a job on the S3 buckets that contain the affected data. Filter the findings by using the SensitiveData:S3Object/Personal finding type.", "Use Amazon Macie to run a job on the S3 buckets that contain the affected data. Filter the findings by using the SensitiveData:S3Object/Financial finding type.", "Use Amazon Macie to run a job on the S3 buckets that contain the affected data. Filter the findings by using the SensitiveData:S3Object/Personal finding type.", "Use Amazon Athena to run a job on the S3 buckets that contain the affected data. Filter the findings by using the SensitiveData:S3Object/Financial finding type"], "correct": [1]}, {"id": 4, "type": "single", "text": "A company has a web application that runs on Amazon EC2 instances with a custom Amazon Machine Image (AMI). The company uses AWS CloudFormation to provision the application. The application runs in the us-east-1 Region, and the company needs to deploy the application to the us-west-1 Region. An attempt to create the AWS CloudFormation stack in us-west-1 fails. An error message states that the AMI ID does not exist. A developer must resolve this error with a solution that uses the least amount of operational overhead. Which solution meets these requirements?", "options": ["Change the AWS CloudFormation templates for us-east-1 and us-west-1 to use an AWS AMI. Relaunch the stack for both Regions.", "Copy the custom AMI from us-east-1 to us-west-1. Update the AWS CloudFormation template for us-west-1 to refer to AMI ID for the copied AMI. Relaunch the stack.", "Build the custom AMI in us-west-1. Create a new AWS CloudFormation template to launch the stack in us-west-1 with the new AMI ID.", "Manually deploy the application outside AWS CloudFormation in us-west-1."], "correct": [1]}, {"id": 5, "type": "single", "text": "A developer is updating several AWS Lambda functions and notices that all the Lambda functions share the same custom libraries. The developer wants to centralize all the libraries, update the libraries in a convenient way, and keep the libraries versioned. Which solution will meet these requirements with the LEAST development effort?", "options": ["Create an AWS CodeArtifact repository that contains all the custom libraries.", "Create a custom container image for the Lambda functions to save all the custom libraries.", "Create a Lambda layer that contains all the custom libraries.", "Create an Amazon Elastic File System (Amazon EFS) file system to store all the custom libraries."], "correct": [2]}, {"id": 6, "type": "single", "text": "A developer wants to use AWS Elastic Beanstalk to test a new version of an application in a test environment. Which deployment method offers the FASTEST deployment?", "options": ["Immutable", "Rolling", "Rolling with additional batch", "All at once"], "correct": [3]}, {"id": 7, "type": "single", "text": "A company is providing read access to objects in an Amazon S3 bucket for different customers. The company uses IAM permissions to restrict access to the S3 bucket. The customers can access only their own files. Due to a regulation requirement, the company needs to enforce encryption in transit for interactions with Amazon S3. Which solution will meet these requirements?", "options": ["Add a bucket policy to the S3 bucket to deny S3 actions when the aws:SecureTransport condition is equal to false.", "Add a bucket policy to the S3 bucket to deny S3 actions when the s3:x-amz-acl condition is equal to public-read.", "Add an IAM policy to the IAM users to enforce the usage of the AWS SDK.", "Add an IAM policy to the IAM users that allows S3 actions when the s3:x-amz-acl condition is equal to bucket-owner-read."], "correct": [0]}, {"id": 8, "type": "multi", "text": "A team is developing an application that is deployed on Amazon EC2 instances. During testing, the team receives an error. The EC2 instances are unable to access an Amazon S3 bucket. Which steps should the team take to troubleshoot this issue? (Choose two.)", "options": ["Check whether the policy that is assigned to the IAM role that is attached to the EC2 instances grants access to Amazon S3.", "Check the S3 bucket policy to validate the access permissions for the S3 bucket.", "Check whether the policy that is assigned to the IAM user that is attached to the EC2 instances grants access to Amazon S3.", "Check the S3 Lifecycle policy to validate the permissions that are assigned to the S3 bucket.", "Check the security groups that are assigned to the EC2 instances. Make sure that a rule is not blocking the access to Amazon S3."], "correct": [0, 1]}, {"id": 9, "type": "single", "text": "A developer is working on an ecommerce website. The developer wants to review server logs without logging in to each of the application servers individually. The website runs on multiple Amazon EC2 instances, is written in Python, and needs to be highly available. How can the developer update the application to meet these requirements with MINIMUM changes?", "options": ["Rewrite the application to be cloud native and to run on AWS Lambda, where the logs can be reviewed in Amazon CloudWatch.", "Set up centralized logging by using Amazon OpenSearch Service, Logstash, and OpenSearch Dashboards.", "Scale down the application to one larger EC2 instance where only one instance is recording logs.", "Install the unified Amazon CloudWatch agent on the EC2 instances. Configure the agent to push the application logs to CloudWatch."], "correct": [3]}, {"id": 10, "type": "multi", "text": "A company is creating an application that processes .csv files from Amazon S3. A developer has created an S3 bucket. The developer has also created an AWS Lambda function to process the .csv files from the S3 bucket. Which combination of steps will invoke the Lambda function when a .csv file is uploaded to Amazon S3? (Choose two.)", "options": ["Create an Amazon EventBridge rule. Configure the rule with a pattern to match the S3 object created event.", "Schedule an Amazon EventBridge rule to run a new Lambda function to scan the S3 bucket.", "Add a trigger to the existing Lambda function. Set the trigger type to EventBridge. Select the Amazon EventBridge rule.", "Create a new Lambda function to scan the S3 bucket for recently added S3 objects.", "Add S3 Lifecycle rules to invoke the existing Lambda function."], "correct": [0, 2]}, {"id": 11, "type": "single", "text": "A developer needs to build an AWS CloudFormation template that self-populates the AWS Region variable that deploys the CloudFormation template. What is the MOST operationally efficient way to determine the Region in which the template is being deployed?", "options": ["Use the AWS::Region pseudo parameter.", "Require the Region as a CloudFormation parameter.", "Find the Region from the AWS::StackId pseudo parameter by using the Fn::Split intrinsic function.", "Dynamically import the Region by referencing the relevant parameter in AWS Systems Manager Parameter Store."], "correct": [0]}, {"id": 12, "type": "single", "text": "A developer maintains a critical business application that uses Amazon DynamoDB as the primary data store. The DynamoDB table contains millions of documents and receives 30-60 requests each minute. The developer needs to perform processing in near-real time on the documents when they are added or updated in the DynamoDB table. How can the developer implement this feature with the LEAST amount of change to the existing application code?", "options": ["Set up a cron job on an Amazon EC2 instance. Run a script every hour to query the table for changes and process the documents.", "Enable a DynamoDB stream on the table. Invoke an AWS Lambda function to process the documents.", "Update the application to send a PutEvents request to Amazon EventBridge. Create an EventBridge rule to invoke an AWS Lambda function to process the documents.", "Update the application to synchronously process the documents directly after the DynamoDB write."], "correct": [1]}, {"id": 13, "type": "multi", "text": "A real-time messaging application uses Amazon API Gateway WebSocket APIs with backend HTTP service. A developer needs to build a feature in the application to identify a client that keeps connecting to and disconnecting from the WebSocket connection. The developer also needs the ability to remove the client. Which combination of changes should the developer make to the application to meet these requirements? (Choose two.)", "options": ["Switch to HTTP APIs in the backend service.", "Switch to REST APIs in the backend service.", "Use the callback URL to disconnect the client from the backend service.", "Add code to track the client status in Amazon ElastiCache in the backend service.", "Implement $connect and $disconnect routes in the backend service."], "correct": [3, 4]}, {"id": 14, "type": "single", "text": "A developer has written code for an application and wants to share it with other developers on the team to receive feedback. The shared application code needs to be stored long-term with multiple versions and batch change tracking. Which AWS service should the developer use?", "options": ["AWS CodeBuild", "Amazon S3", "AWS CodeCommit", "AWS Cloud9"], "correct": [2]}, {"id": 15, "type": "single", "text": "An organization is storing large files in Amazon S3, and is writing a web application to display meta-data about the files to end-users. Based on the metadata a user selects an object to download. The organization needs a mechanism to index the files and provide single-digit millisecond latency retrieval for the metadata. What AWS service should be used to accomplish this?", "options": ["Amazon DynamoDB", "Amazon EC2", "AWS Lambda", "Amazon RDS"], "correct": [0]}, {"id": 16, "type": "single", "text": "A developer is creating an AWS Serverless Application Model (AWS SAM) template. The AWS SAM template contains the definition of multiple AWS Lambda functions, an Amazon S3 bucket, and an Amazon CloudFront distribution. One of the Lambda functions runs on Lambda@Edge in the CloudFront distribution. The S3 bucket is configured as an origin for the CloudFront distribution. When the developer deploys the AWS SAM template in the eu-west-1 Region, the creation of the stack fails. Which of the following could be the reason for this issue?", "options": ["CloudFront distributions can be created only in the us-east-1 Region.", "Lambda@Edge functions can be created only in the us-east-1 Region.", "A single AWS SAM template cannot contain multiple Lambda functions.", "The CloudFront distribution and the S3 bucket cannot be created in the same Region."], "correct": [1]}, {"id": 17, "type": "single", "text": "A developer is integrating Amazon ElastiCache in an application. The cache will store data from a database. The cached data must populate real-time dashboards. Which caching strategy will meet these requirements?", "options": ["A read-through cache", "A write-behind cache", "A lazy-loading cache", "A write-through cache"], "correct": [3]}, {"id": 18, "type": "single", "text": "A company is developing an ecommerce application that uses Amazon API Gateway APIs. The application uses AWS Lambda as a backend. The company needs to test the code in a dedicated, monitored test environment before the company releases the code to the production environment. Which solution will meet these requirements?", "options": ["Use a single stage in API Gateway. Create a Lambda function for each environment. Configure API clients to send a query parameter that indicates the environment and the specific Lambda function.", "Use multiple stages in API Gateway. Create a single Lambda function for all environments. Add different code blocks for di intenance window. Which deployment configuration will meet these requirements with the LEAST deployment time?", "options": ["Use the AWS CodeDeploy in-place deployment configuration for the Lambda functions. Shift all traffic immediately after deployment.", "Use the AWS CodeDeploy linear deployment configuration to shift 10% of the traffic every minute.", "Use the AWS CodeDeploy all-at-once deployment configuration to shift all traffic to the updated versions immediately.", "Use the AWS CodeDeploy predefined canary deployment configuration to shift 10% of the traffic immediately and shift the remaining traffic after 5 minutes."], "correct": [3]}, {"id": 21, "type": "single", "text": "A company created four AWS Lambda functions that connect to a relational database server that runs on an Amazon RDS instance. A security team requires the company to automatically change the database password every 30 days. Which solution will meet these requirements MOST securely?", "options": ["Store the database credentials in the environment variables of the Lambda function. Deploy the Lambda function with the new credentials every 30 days.", "Store the database credentials in AWS Secrets Manager. Configure a 30-day rotation schedule for the credentials.", "Store the database credentials in AWS Systems Manager Parameter Store secure strings. Configure a 30-day schedule for the secure strings.", "Store the database credentials in an Amazon S3 bucket that uses server-side encryption with customer-provided encryption keys (SSE-C). Configure a 30-day key rotation schedule for the customer key."], "correct": [1]}, {"id": 22, "type": "single", "text": "A company has an application that uses AWS CodePipeline to automate its continuous integration and continuous delivery (CI/CD) workflow. The application uses AWS CodeCommit for version control. A developer who was working on one of the tasks did not pull the most recent changes from the main branch. A week later, the developer noticed merge conflicts. How can the developer resolve the merge conflicts in the developer's branch with the LEAST development effort?", "options": ["Clone the repository. Create a new branch. Update the branch with the changes.", "Create a new branch. Apply the changes from the previous branch.", "Use the Commit Visualizer view to compare the commits when a feature was added. Fix the merge conflicts.", "Stop the pull from the main branch to the feature branch. Rebase the feature branch from the main branch."], "correct": [3]}, {"id": 23, "type": "single", "text": "An online food company provides an Amazon API Gateway HTTP API to receive orders for partners. The API is integrated with an AWS Lambda function. The Lambda function stores the orders in an Amazon DynamoDB table. The company expects to onboard additional partners. Some of the partners require additional Lambda functions to receive orders. The company has created an Amazon S3 bucket. The company needs to store all orders and updates in the S3 bucket for future analysis. How can the developer ensure that all orders and updates are stored to Amazon S3 with the LEAST development effort?", "options": ["Create a new Lambda function and a new API Gateway API endpoint. Configure the new Lambda function to write to the S3 bucket. Modify the original Lambda function to post updates to the new API endpoint.", "Use Amazon Kinesis Data Streams to create a new data stream. Modify the Lambda function to publish orders to the data stream. Configure the data stream to write to the S3 bucket.", "Enable DynamoDB Streams on the DynamoDB table. Create a new Lambda function. Associate the stream's Amazon Resource Name (ARN) with the Lambda function. Configure the Lambda function to write to the S3 bucket as records appear in the table's stream.", "Modify the Lambda function to publish to a new Amazon Simple Notification Service (Amazon SNS) topic as the Lambda function receives orders. Subscribe a new Lambda function to the topic. Configure the new Lambda function to write to the S3 bucket as updates come through the topic."], "correct": [2]}, {"id": 24, "type": "multi", "text": "A company's website runs on an Amazon EC2 instance and uses Auto Scaling to scale the environment during peak times. Website users across the world are experiencing high latency due to static content on the EC2 instance, even during non-peak hours. Which combination of steps will resolve the latency issue? (Choose two.)", "options": ["Double the Auto Scaling group's maximum number of servers.", "Host the application code on AWS Lambda.", "Scale vertically by resizing the EC2 instances.", "Create an Amazon CloudFront distribution to cache the static content.", "Store the application's static content in Amazon S3."], "correct": [3, 4]}, {"id": 25, "type": "single", "text": "A company has an Amazon S3 bucket containing premier content that it intends to make available to only paid subscribers of its website. The S3 bucket currently has default permissions of all objects being private to prevent inadvertent exposure of the premier content to non-paying website visitors. How can the company limit the ability to download a premier content file in the S3 bucket to paid subscribers only?", "options": ["Apply a bucket policy that allows anonymous users to download the content from the S3 bucket.", "Generate a pre-signed object URL for the premier content file when a paid subscriber requests a download.", "Add a bucket policy that requires multi-factor authentication for requests to access the S3 bucket objects.", "Enable server-side encryption on the S3 bucket for data protection against the non-paying website visitors."], "correct": [1]}, {"id": 26, "type": "single", "text": "A developer is building an application that uses AWS API Gateway APIs, AWS Lambda functions, and AWS DynamoDB tables. The developer uses the AWS Serverless Application Model (AWS SAM) to build and run serverless applications on AWS. Each time the developer pushes changes for only to the Lambda functions, all the artifacts in the application are rebuilt. The developer wants to implement AWS SAM Accelerate by running a command to only redeploy the Lambda functions that have changed. Which command will meet these requirements?", "options": ["sam deploy --force-upload", "sam deploy --no-execute-changeset", "sam package", "sam sync --watch"], "correct": [3]}, {"id": 27, "type": "multi", "text": "An organization is using Amazon CloudFront to ensure that its users experience low-latency access to its web application. The organization has identified a need to encrypt all traffic between users and CloudFront, and all traffic between CloudFront and the web application. How can these requirements be met? (Choose two.)", "options": ["Use AWS KMS to encrypt traffic between CloudFront and the web application.", "Set the Origin Protocol Policy to \"HTTPS Only\".", "Set the Origin's HTTP Port to 443.", "Set the Viewer Protocol Policy to \"HTTPS Only\" or \"Redirect HTTP to HTTPS\".", "Enable the CloudFront option Restrict Viewer Access."], "correct": [1, 3]}, {"id": 28, "type": "single", "text": "A developer is deploying an AWS Lambda function. The developer wants the ability to return to older versions of the function quickly and seamlessly. How can the developer achieve this goal with the LEAST operational overhead?", "options": ["Use AWS OpsWorks to perform blue/green deployments.", "Use a function alias with different versions.", "Maintain deployment packages for older versions in Amazon S3.", "Use AWS CodePipeline for deployments and rollbacks."], "correct": [1]}, {"id": 29, "type": "single", "text": "A developer is planning to migrate on-premises company data to Amazon S3. The data must be encrypted, and the encryption keys must support automatic annual rotation. The company must use AWS Key Management Service (AWS KMS) to encrypt the data. Which type of keys should the developer use to meet these requirements?", "options": ["Amazon S3 managed keys", "Symmetric customer managed keys with key material that is generated by AWS", "Asymmetric customer managed keys with key material that is generated by AWS", "Symmetric customer managed keys with imported key material"], "correct": [1]}, {"id": 30, "type": "single", "text": "A company has multiple Amazon VPC endpoints in the same VPC. A developer needs to configure an Amazon S3 bucket policy so users can access an S3 bucket only by using these VPC endpoints. Which solution will meet these requirements?", "options": ["Create multiple S3 bucket policies by using each VPC endpoint ID that have the aws:SourceVpce value in the StringNotEquals condition.", "Create a single S3 bucket policy that has the aws:SourceVpc value and in the StringNotEquals condition to use VPC ID.", "Create a single S3 bucket policy that has the aws:SourceVpce value and in the StringNotEquals condition to use vpce*.", "Create a single S3 bucket policy that has multiple aws:sourceVpce value in the StringNotEquals condition. Repeat for all the VPC endpoint IDs."], "correct": [3]}];

  var STORAGE_KEY = 'aws-dva-practice-answers-v1';
  var answers = {}; // { questionId: [optionIndex, ...] }
  var currentIndex = 0;

  function loadAnswers() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) answers = JSON.parse(raw);
    } catch (e) { answers = {}; }
  }
  function saveAnswers() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(answers)); } catch (e) {}
  }

  var testView = document.getElementById('testView');
  var reviewView = document.getElementById('reviewView');
  var resultsView = document.getElementById('resultsView');
  var questionCard = document.getElementById('questionCard');
  var navGrid = document.getElementById('navGrid');
  var progressPill = document.getElementById('progressPill');

  function answeredCount() {
    return Object.keys(answers).filter(function (k) {
      return answers[k] && answers[k].length > 0;
    }).length;
  }

  function renderNavGrid() {
    navGrid.innerHTML = '';
    QUESTIONS.forEach(function (q, i) {
      var b = document.createElement('button');
      b.textContent = q.id;
      var isAnswered = answers[q.id] && answers[q.id].length > 0;
      if (isAnswered) b.classList.add('answered');
      if (i === currentIndex) b.classList.add('current');
      b.addEventListener('click', function () {
        currentIndex = i;
        renderQuestion();
        renderNavGrid();
      });
      navGrid.appendChild(b);
    });
    progressPill.textContent = answeredCount() + ' / ' + QUESTIONS.length + ' answered';
  }

  function toggleAnswer(q, optionIndex) {
    var current = answers[q.id] || [];
    if (q.type === 'single') {
      current = [optionIndex];
    } else {
      var pos = current.indexOf(optionIndex);
      if (pos >= 0) current.splice(pos, 1);
      else current.push(optionIndex);
    }
    answers[q.id] = current;
    saveAnswers();
  }

  function renderQuestion() {
    var q = QUESTIONS[currentIndex];
    var selected = answers[q.id] || [];
    var badge = q.type === 'multi' ? 'Select ' + (q.options.length >= 5 ? 'two' : 'multiple') : 'Select one';

    var html = '';
    html += '<div class="q-meta">';
    html += '<span class="q-number">Question ' + q.id + ' of ' + QUESTIONS.length + '</span>';
    html += '<span class="q-type-badge">' + badge + '</span>';
    html += '</div>';
    html += '<p class="q-text">' + escapeHtml(q.text) + '</p>';
    html += '<div class="options">';
    q.options.forEach(function (opt, i) {
      var isSel = selected.indexOf(i) >= 0;
      var inputType = q.type === 'multi' ? 'checkbox' : 'radio';
      var id = 'q' + q.id + '_opt' + i;
      html += '<div class="option' + (isSel ? ' selected' : '') + '" data-index="' + i + '">';
      html += '<input type="' + inputType + '" id="' + id + '" name="q' + q.id + '"' + (isSel ? ' checked' : '') + '>';
      html += '<label for="' + id + '">' + escapeHtml(opt) + '</label>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="nav-buttons">';
    html += '<button class="btn" id="prevBtn"' + (currentIndex === 0 ? ' disabled' : '') + '>&larr; Previous</button>';
    if (currentIndex === QUESTIONS.length - 1) {
      html += '<button class="btn btn-primary" id="toReviewBtn">Review &amp; submit &rarr;</button>';
    } else {
      html += '<button class="btn btn-primary" id="nextBtn">Next &rarr;</button>';
    }
    html += '</div>';

    questionCard.innerHTML = html;

    Array.prototype.forEach.call(questionCard.querySelectorAll('.option'), function (el) {
      el.addEventListener('click', function (e) {
        if (e.target.tagName === 'INPUT') return;
        var idx = parseInt(el.getAttribute('data-index'), 10);
        toggleAnswer(q, idx);
        renderQuestion();
        renderNavGrid();
      });
      var input = el.querySelector('input');
      input.addEventListener('change', function () {
        var idx = parseInt(el.getAttribute('data-index'), 10);
        toggleAnswer(q, idx);
        renderQuestion();
        renderNavGrid();
      });
    });

    var prevBtn = document.getElementById('prevBtn');
    if (prevBtn) prevBtn.addEventListener('click', function () {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); renderNavGrid(); window.scrollTo(0,0); }
    });
    var nextBtn = document.getElementById('nextBtn');
    if (nextBtn) nextBtn.addEventListener('click', function () {
      if (currentIndex < QUESTIONS.length - 1) { currentIndex++; renderQuestion(); renderNavGrid(); window.scrollTo(0,0); }
    });
    var toReviewBtn = document.getElementById('toReviewBtn');
    if (toReviewBtn) toReviewBtn.addEventListener('click', showReview);
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function arraysMatch(a, b) {
    var sa = a.slice().sort(function(x,y){return x-y;});
    var sb = b.slice().sort(function(x,y){return x-y;});
    if (sa.length !== sb.length) return false;
    for (var i = 0; i < sa.length; i++) if (sa[i] !== sb[i]) return false;
    return true;
  }

  function correctCount() {
    return QUESTIONS.filter(function (q) {
      var selected = answers[q.id] || [];
      return arraysMatch(selected, q.correct);
    }).length;
  }

  function buildAnswerList(container, isFinal) {
    container.innerHTML = '';
    QUESTIONS.forEach(function (q, i) {
      var selected = answers[q.id] || [];
      var item = document.createElement('div');
      item.className = 'review-item';

      var isCorrect = isFinal ? arraysMatch(selected, q.correct) : null;
      if (isFinal) item.classList.add(isCorrect ? 'graded-correct' : 'graded-incorrect');

      var head = '<div class="head"><span class="num">Q' + q.id + '</span>';
      if (!isFinal && selected.length === 0) head += '<span class="flag">Not answered</span>';
      if (isFinal) {
        head += isCorrect
          ? '<span class="grade-tag tag-correct">Correct</span>'
          : '<span class="grade-tag tag-incorrect">Incorrect</span>';
      }
      head += '</div>';

      var body = '<p class="qtext">' + escapeHtml(q.text) + '</p>';
      body += '<div class="selected-list">';

      if (!isFinal) {
        if (selected.length === 0) {
          body += '<div class="none">No answer selected</div>';
        } else {
          selected.slice().sort(function(a,b){return a-b;}).forEach(function (idx) {
            body += '<div class="sel-option picked"><span class="tag">SELECTED</span>' + escapeHtml(q.options[idx]) + '</div>';
          });
        }
      } else {
        // Graded view: show every option's state.
        q.options.forEach(function (opt, idx) {
          var wasSelected = selected.indexOf(idx) >= 0;
          var isRight = q.correct.indexOf(idx) >= 0;
          var cls = 'sel-option';
          var tag = '';
          if (wasSelected && isRight) {
            cls += ' opt-correct-picked';
            tag = '<span class="tag">YOUR ANSWER \u2713</span>';
          } else if (wasSelected && !isRight) {
            cls += ' opt-wrong-picked';
            tag = '<span class="tag tag-wrong">YOUR ANSWER \u2717</span>';
          } else if (!wasSelected && isRight) {
            cls += ' opt-missed-correct';
            tag = '<span class="tag tag-missed">CORRECT ANSWER</span>';
          }
          body += '<div class="' + cls + '">' + tag + escapeHtml(opt) + '</div>';
        });
      }
      body += '</div>';

      if (!isFinal) {
        body += '<button class="edit-link" data-idx="' + i + '">Edit answer</button>';
      }

      item.innerHTML = head + body;
      container.appendChild(item);
    });

    if (!isFinal) {
      Array.prototype.forEach.call(container.querySelectorAll('.edit-link'), function (btn) {
        btn.addEventListener('click', function () {
          currentIndex = parseInt(btn.getAttribute('data-idx'), 10);
          showTest();
        });
      });
    }
  }

  function showTest() {
    testView.classList.remove('hidden');
    reviewView.classList.add('hidden');
    resultsView.classList.add('hidden');
    renderQuestion();
    renderNavGrid();
    window.scrollTo(0,0);
  }

  function showReview() {
    testView.classList.add('hidden');
    reviewView.classList.remove('hidden');
    resultsView.classList.add('hidden');
    document.getElementById('reviewCount').textContent = answeredCount() + ' / ' + QUESTIONS.length + ' answered';
    buildAnswerList(document.getElementById('reviewList'), false);
    window.scrollTo(0,0);
  }

  function showResults() {
    testView.classList.add('hidden');
    reviewView.classList.add('hidden');
    resultsView.classList.remove('hidden');
    document.getElementById('resultsAnswered').textContent = answeredCount() + '/' + QUESTIONS.length;
    document.getElementById('resultsScore').textContent = correctCount() + '/' + QUESTIONS.length;
    buildAnswerList(document.getElementById('resultsList'), true);
    window.scrollTo(0,0);
  }

  document.getElementById('reviewBtn').addEventListener('click', showReview);
  document.getElementById('backToTest').addEventListener('click', showTest);
  document.getElementById('submitBtn').addEventListener('click', showResults);
  document.getElementById('retakeBtn').addEventListener('click', function () {
    answers = {};
    saveAnswers();
    currentIndex = 0;
    showTest();
  });

  loadAnswers();
  showTest();
})();
</script>
</body>
</html>
